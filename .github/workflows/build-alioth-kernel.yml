name: Build alioth kernel (Docker-enabled)

# 在 GitHub 云端 Ubuntu 上编译支持 Docker 的 alioth 内核
# 产出：Image / Image.gz / 全部 .ko 模块 / 合并后的 .config
# 若仓库根目录存在 stock_boot.img，还会自动用 magiskboot 重新打包出可直接刷入的 boot.img

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: '使用哪个 defconfig'
        required: false
        default: 'alioth_defconfig'
      repack:
        description: '是否用 stock_boot.img 重打包 boot.img (auto/yes/no)'
        required: false
        default: 'auto'
      kernel_ref:
        description: '内核树 commit（留空 = 使用已验证的锁定版本）'
        required: false
        default: ''
      mode:
        description: '构建模式：docker=打补丁+合并容器配置片段 / clean=原厂 defconfig 干净对照（不补丁不合并，用于定位内核起不来的原因）'
        required: false
        default: 'docker'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      - name: 检出本仓库（CI 配置）
        uses: actions/checkout@v4
        with:
          path: ci

      - name: 声明构建模式
        run: |
          M="${{ github.event.inputs.mode }}"
          [ -n "$M" ] || M=docker
          echo "构建模式: $M"
          if [ "$M" = "clean" ]; then
            echo "→ 干净对照：不应用模块兼容补丁、不合并 Docker 配置片段、跳过配置闸门"
            echo "  目的：判断内核起不来是「内核树/工具链」问题还是「我们的补丁与配置」问题"
          else
            echo "→ Docker 模式：应用模块补丁 + 合并容器配置片段 + 配置闸门"
          fi

      - name: 安装构建依赖与 Clang 工具链
        run: |
          set -eux
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            clang-14 lld-14 llvm-14 \
            binutils-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            bc bison flex libssl-dev libelf-dev cpio kmod \
            python3 python3-pip zip unzip xz-utils
          # 把带版本号的 clang 工具链软链成内核 LLVM=1 所期望的名字
          mkdir -p "$HOME/llvm-bin"
          for t in clang clang++ ld.lld llvm-ar llvm-nm llvm-objcopy \
                   llvm-objdump llvm-readelf llvm-size llvm-strip llvm-as; do
            if [ -x "/usr/bin/${t}-14" ]; then ln -sf "/usr/bin/${t}-14" "$HOME/llvm-bin/$t"; fi
          done
          ln -sf /usr/bin/ld.lld-14 "$HOME/llvm-bin/ld.lld"
          echo "$HOME/llvm-bin" >> "$GITHUB_PATH"
          "$HOME/llvm-bin/clang" --version | head -2 || clang-14 --version | head -2

      - name: 克隆内核源码（锁定到已验证的 commit）
        env:
          KERNEL_REF: ${{ github.event.inputs.kernel_ref || '8b19a1dd26ae283a2bfc33781905255339aae485' }}
        run: |
          set -eux
          # 锁定 commit 的原因：该内核树仍在活跃维护，master 会变动；
          # 而 scripts/patch-module-compat.py 依赖内核源码的精确文本。
          # 锁到已验证的 commit，补丁才能保证命中。
          git init -q kernel-src
          cd kernel-src
          git remote add origin https://github.com/zfdx123/kernel_xiaomi_alioth.git
          git fetch -q --depth 1 origin "$KERNEL_REF"
          git checkout -q FETCH_HEAD
          echo "== 实际使用 commit =="
          git rev-parse HEAD
          echo "== 内核版本 =="
          head -5 Makefile

      - name: 应用模块兼容补丁
        if: ${{ github.event.inputs.mode != 'clean' }}
        run: |
          set -eux
          cd kernel-src
          # 脚本自身会校验：①两处外科改动必须命中 ②补丁不得制造任何
          # 无引用的静态函数（本内核 CONFIG_CC_WERROR=y，-Wunused-function 会直接
          # 导致编译失败）③花括号平衡。任一不满足即以非 0 退出。
          python3 ../ci/scripts/patch-module-compat.py
          echo "== 校验补丁标记（应有 2 处）=="
          n=$(grep -c "alioth-docker-patch" kernel/module.c)
          echo "找到 $n 处 alioth-docker-patch 标记"
          test "$n" -ge 2
          echo "== 确认拒绝性返回已移除 =="
          if grep -q -- "-ENOEXEC;" kernel/module.c && grep -A3 "same_magic(modmagic" kernel/module.c | grep -q -- "-ENOEXEC;"; then
            echo "::error:: check_modinfo 中仍存在 return -ENOEXEC，补丁未生效"
            exit 1
          fi
          echo "OK"

      - name: 生成 base defconfig
        run: |
          set -eux
          cd kernel-src
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            ${{ github.event.inputs.defconfig || 'alioth_defconfig' }}

      - name: 合并 Docker 能力配置片段
        if: ${{ github.event.inputs.mode != 'clean' }}
        run: |
          set -eux
          cd kernel-src
          scripts/kconfig/merge_config.sh -m -O out out/.config \
            ../ci/config/docker-kernel.fragment
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            olddefconfig

      - name: 配置校验闸门（关键项缺失则中止构建）
        if: ${{ github.event.inputs.mode != 'clean' }}
        run: |
          set -eu
          cd kernel-src
          FAIL=0
          echo "===== 致命项（Docker 必需）====="
          for k in CONFIG_NAMESPACES CONFIG_PID_NS CONFIG_CGROUP_DEVICE \
                   CONFIG_NET_NS CONFIG_OVERLAY_FS; do
            if grep -qx "${k}=y" out/.config; then echo "  [OK]   $k"; else echo "  [FAIL] $k"; FAIL=1; fi
          done
          echo "===== 重要项 ====="
          for k in CONFIG_USER_NS CONFIG_CGROUP_PIDS CONFIG_IPC_NS \
                   CONFIG_NETFILTER_XT_MATCH_ADDRTYPE CONFIG_BRIDGE_NETFILTER \
                   CONFIG_SYSVIPC CONFIG_POSIX_MQUEUE; do
            if grep -qx "${k}=y" out/.config; then echo "  [OK]   $k"; else echo "  [FAIL] $k"; FAIL=1; fi
          done
          echo "===== 基础项 ====="
          for k in CONFIG_MEMCG CONFIG_CGROUP_SCHED CONFIG_CGROUP_FREEZER \
                   CONFIG_BRIDGE CONFIG_VETH CONFIG_NF_NAT \
                   CONFIG_IP_NF_TARGET_MASQUERADE CONFIG_SECCOMP CONFIG_BLK_DEV_LOOP; do
            if grep -qx "${k}=y" out/.config; then echo "  [OK]   $k"; else echo "  [FAIL] $k"; FAIL=1; fi
          done
          echo "===== Root 支持（ReSukiSU manual hook）====="
          grep -E "^CONFIG_(KSU|KALLSYMS_ALL)" out/.config || echo "  (未找到 KSU 相关配置，请人工确认)"
          if [ "$FAIL" = "1" ]; then
            echo "::error:: 关键配置缺失，中止构建（避免产出无用的内核）"
            exit 1
          fi
          echo "全部关键配置校验通过 ✅"

      - name: 编译内核
        run: |
          set -eux
          cd kernel-src
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            -j"$(nproc)"

      - name: 收集产物
        run: |
          set -eux
          cd kernel-src
          mkdir -p ../artifacts
          cp out/arch/arm64/boot/Image ../artifacts/Image
          [ -f out/arch/arm64/boot/Image.gz ] && cp out/arch/arm64/boot/Image.gz ../artifacts/ || true
          cp out/.config ../artifacts/kernel.config

          # ---- dtbo.img：设备树 overlay，必须随内核一起刷 ----
          # 内核驱动的 DTS binding 与出厂 dtbo 里的 DTB 可能不一致，
          # 只换内核不换 dtbo 会导致关键驱动（UFS/显示）起不来，卡在开机 logo。
          if [ -f out/arch/arm64/boot/dtbo.img ]; then
            cp out/arch/arm64/boot/dtbo.img ../artifacts/dtbo.img
            echo "== dtbo.img 已收集 =="
            ls -l ../artifacts/dtbo.img
            echo "-- 内含 DTB 条目数（DT table header）--"
            python3 - <<'PY'
            import struct
            b = open('../artifacts/dtbo.img','rb').read()
            magic, total, hsz, esz, ecnt, eoff, psz, ver = struct.unpack('>8I', b[:32])
            print(f'  magic=0x{magic:08x} entries={ecnt} total={total} page={psz}')
            names = []
            for i in range(ecnt):
                off = eoff + i*esz
                ds, do = struct.unpack('>II', b[off:off+8])
                blob = b[do:do+ds]
                k = blob.find(b'xiaomi alioth')
                names.append('alioth' if k != -1 else '.')
            print('  alioth 条目:', names.count('alioth'), '/', ecnt)
            PY
          else
            echo "::error::未生成 dtbo.img —— 内核树的 DTS 可能未被编译，检查 CONFIG_BUILD_ARM64_DT_OVERLAY"
            exit 1
          fi

          echo "== 产物清单 =="
          ls -lh ../artifacts
          echo "== 内核版本串与 vermagic =="
          strings ../artifacts/Image | grep -m1 "Linux version" || true
          strings ../artifacts/Image | grep -m1 "4\.19\..* SMP" || true

      - name: 收集编译出的内核模块
        run: |
          set -eux
          cd kernel-src
          mkdir -p ../artifacts/modules
          find out -name '*.ko' -exec cp {} ../artifacts/modules/ \; 2>/dev/null || true
          echo "模块数量: $(ls -1 ../artifacts/modules 2>/dev/null | wc -l)"

      - name: 用 magiskboot 重打包 boot.img
        id: repack
        if: ${{ github.event.inputs.repack != 'no' }}
        run: |
          set -eu
          if [ ! -f ci/stock_boot.img ]; then
            echo "未发现 ci/stock_boot.img，跳过重打包（只产出 Image）"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set -eux
          # ---- 基准镜像完整性校验：boot 镜像只允许逐字节原样，任何改动都会导致刷不开机 ----
          echo "== 基准 boot 镜像 =="
          ls -l ci/stock_boot.img
          if [ -f ci/stock_boot.img.sha256 ]; then
            ( cd ci && sha256sum -c stock_boot.img.sha256 )
            echo "基准镜像 SHA-256 校验通过"
          else
            echo "::error::缺少 ci/stock_boot.img.sha256，拒绝使用未校验的基准镜像"
            exit 1
          fi
          # 取 magiskboot（Magisk APK 内含 Linux x86_64 版本）
          curl -sL -o Magisk.apk \
            https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk
          mkdir -p mb && unzip -o -j Magisk.apk 'lib/x86_64/libmagiskboot.so' -d mb
          chmod +x mb/libmagiskboot.so
          cd kernel-src
          mkdir -p ../repack && cd ../repack
          cp ../ci/stock_boot.img boot.img
          ../mb/libmagiskboot.so unpack boot.img
          echo "== 解包结果 =="
          ls -l
          echo "== 原厂内核段大小 =="
          stat -c '%n  %s 字节' kernel 2>/dev/null || echo "(无 kernel 段)"
          cp ../artifacts/Image kernel
          ../mb/libmagiskboot.so repack boot.img
          cp new-boot.img ../artifacts/boot.img
          echo "== 新 boot.img =="
          ls -lh ../artifacts/boot.img
          sha256sum ../artifacts/boot.img

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: alioth-docker-kernel
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
